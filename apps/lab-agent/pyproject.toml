[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lap-in-the-loop-lab-agent"
version = "0.1.0"
description = "Lab-in-the-Loop agent: model-agnostic agentic loop over the canvus-mcp tools that designs experiments, interprets results, and versions knowledge on a Canvus canvas."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",
  "openai>=1.0",
  "anthropic>=0.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
lab-agent = "lab_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lab_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
