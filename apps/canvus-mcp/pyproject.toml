[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-in-the-loop-canvus-mcp"
version = "0.1.0"
description = "MCP server exposing Canvus tools for Lab-in-the-Loop workflows: scan, content download, widget/connector creation, RagCluster checks, and experiment-loop detection."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",
  "canvus-sdk",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
canvus-mcp = "canvus_mcp.server:main"

[tool.uv.sources]
canvus-sdk = { path = "canvus-sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["canvus_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
